name: Build & Release MarkNote

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.2.0)'
        required: false
        default: 'v1.2.0'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Packages (AppImage, DEB, RPM, Tarball)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies for build & packaging
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 \
            libjpeg-dev libopenjp2-7-dev libffi-dev libcairo2 \
            alien rpm file curl wget

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build all Linux packages
        run: |
          RAW_TAG="${{ github.event.inputs.release_tag || github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          echo "Building version: $VERSION"
          chmod +x packaging/build_linux_packages.sh
          APP_VERSION="$VERSION" packaging/build_linux_packages.sh

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: |
            dist/MarkNote-*-x86_64.AppImage
            dist/marknote_*_amd64.deb
            dist/marknote-*.rpm
            dist/MarkNote-*-linux-x64.tar.gz
            dist/marknote-*.tar.gz

  build-windows:
    name: Build Windows Portable Package (ZIP)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Build Windows release with PyInstaller
        shell: powershell
        run: |
          $rawTag = "${{ github.event.inputs.release_tag || github.ref_name }}"
          $version = $rawTag.TrimStart('v')
          if (-not $version) { $version = "1.2.0" }
          Write-Host "Building Windows package for version: $version"
          powershell -ExecutionPolicy Bypass -File packaging\build_windows.ps1

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist/MarkNote-*-windows-x64.zip

  publish-release:
    name: Publish Release Assets to GitHub
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List downloaded release assets
        run: |
          ls -lh release-assets/

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: release-assets/*
          prerelease: false
          make_latest: true
          generate_release_notes: true
