<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" in="SourceAlpha"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafc"/>

  <!-- System Boundary -->
  <rect x="230" y="40" width="1010" height="760" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="230" y="40" width="1010" height="50" rx="16" fill="#1e293b"/>
  <rect x="230" y="70" width="1010" height="20" fill="#1e293b"/>
  <text x="735" y="72" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="1">
    HỆ THỐNG SOẠN THẢO VÀ QUẢN LÝ GHI CHÚ MÃ NGUỒN MỞ MARKNOTE
  </text>

  <!-- Actor: User -->
  <g transform="translate(90, 400)">
    <circle cx="0" cy="-35" r="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" filter="url(#shadow)"/>
    <line x1="0" y1="-13" x2="0" y2="40" stroke="#2563eb" stroke-width="3"/>
    <line x1="-30" y1="5" x2="30" y2="5" stroke="#2563eb" stroke-width="3"/>
    <line x1="0" y1="40" x2="-25" y2="90" stroke="#2563eb" stroke-width="3"/>
    <line x1="0" y1="40" x2="25" y2="90" stroke="#2563eb" stroke-width="3"/>
    <text x="0" y="115" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Người dùng</text>
    <text x="0" y="133" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#64748b">(Cá nhân / User)</text>
  </g>

  <!-- UC Groups Columns -->
  <!-- Col 1: Quản trị Ghi chú & Soạn thảo (x=270, width=280) -->
  <g transform="translate(260, 110)">
    <rect x="0" y="0" width="290" height="660" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="145" y="30" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#475569" text-transform="uppercase">
      1. Quản lý Ghi chú &amp; Thao tác
    </text>

    <!-- UC01 -->
    <g id="uc01" transform="translate(15, 50)" filter="url(#shadow)">
      <rect width="260" height="46" rx="23" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
      <text x="130" y="28" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#1e3a8a">UC01: Tạo ghi chú mới</text>
    </g>

    <!-- UC02 -->
    <g id="uc02" transform="translate(15, 115)" filter="url(#shadow)">
      <rect width="260" height="46" rx="23" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
      <text x="130" y="28" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#1e3a8a">UC02: Mở / Xem ghi chú</text>
    </g>

    <!-- UC03 -->
    <g id="uc03" transform="translate(15, 180)" filter="url(#shadow)">
      <rect width="260" height="46" rx="23" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
      <text x="130" y="28" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#1e3a8a">UC03: Sửa ghi chú (Ctrl+S)</text>
    </g>

    <!-- UC04 -->
    <g id="uc04" transform="translate(15, 245)" filter="url(#shadow)">
      <rect width="260" height="46" rx="23" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
      <text x="130" y="28" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#1e3a8a">UC04: Xóa ghi chú (Cascade)</text>
    </g>

    <!-- UC05 -->
    <g id="uc05" transform="translate(15, 310)" filter="url(#shadow)">
      <rect width="260" height="46" rx="23" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
      <text x="130" y="28" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#1e3a8a">UC05: Gắn / Gỡ nhãn Tag</text>
    </g>

    <!-- UC08 -->
    <g id="uc08" transform="translate(15, 375)" filter="url(#shadow)">
      <rect width="260" height="46" rx="23" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
      <text x="130" y="28" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#14532d">UC08: Tìm trong note (Ctrl+F)</text>
    </g>

    <!-- UC09 -->
    <g id="uc09" transform="translate(15, 440)" filter="url(#shadow)">
      <rect width="260" height="46" rx="23" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
      <text x="130" y="28" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#14532d">UC09: Thay thế chữ (Ctrl+H)</text>
    </g>
  </g>

  <!-- Col 2: Trình diễn, Cuộn & Tra cứu FTS5 (x=590, width=300) -->
  <g transform="translate(585, 110)">
    <rect x="0" y="0" width="300" height="660" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="150" y="30" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#475569" text-transform="uppercase">
      2. Trình diễn &amp; Tra cứu FTS5
    </text>

    <!-- UC06 -->
    <g id="uc06" transform="translate(15, 80)" filter="url(#shadow)">
      <rect width="270" height="52" rx="26" fill="#fdf4ff" stroke="#c084fc" stroke-width="2"/>
      <text x="135" y="24" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#581c87">UC06: Live Preview song song</text>
      <text x="135" y="42" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#7e22ce">(Debounce Timer 300ms)</text>
    </g>

    <!-- UC07 -->
    <g id="uc07" transform="translate(15, 190)" filter="url(#shadow)">
      <rect width="270" height="52" rx="26" fill="#fdf4ff" stroke="#c084fc" stroke-width="2"/>
      <text x="135" y="24" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#581c87">UC07: Bật / Tắt Sync Scroll</text>
      <text x="135" y="42" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#7e22ce">(Đồng bộ cuộn trang chuột)</text>
    </g>

    <!-- UC10 -->
    <g id="uc10" transform="translate(15, 340)" filter="url(#shadow)">
      <rect width="270" height="56" rx="28" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
      <text x="135" y="25" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#7c2d12">UC10: Tìm toàn kho FTS5</text>
      <text x="135" y="44" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#ea580c">(&amp; Lọc nhãn nâng cao tag:)</text>
    </g>
  </g>

  <!-- Col 3: Giao diện & Xuất bản (x=925, width=285) -->
  <g transform="translate(920, 110)">
    <rect x="0" y="0" width="290" height="660" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="145" y="30" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#475569" text-transform="uppercase">
      3. Giao diện &amp; Xuất bản in ấn
    </text>

    <!-- UC11 -->
    <g id="uc11" transform="translate(15, 80)" filter="url(#shadow)">
      <rect width="260" height="48" rx="24" fill="#fefce8" stroke="#eab308" stroke-width="1.8"/>
      <text x="130" y="29" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#713f12">UC11: Xem danh sách theme</text>
    </g>

    <!-- UC12 -->
    <g id="uc12" transform="translate(15, 180)" filter="url(#shadow)">
      <rect width="260" height="48" rx="24" fill="#fefce8" stroke="#eab308" stroke-width="1.8"/>
      <text x="130" y="29" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#713f12">UC12: Chuyển đổi theme</text>
    </g>

    <!-- UC13 -->
    <g id="uc13" transform="translate(15, 340)" filter="url(#shadow)">
      <rect width="260" height="54" rx="27" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
      <text x="130" y="25" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#991b1b">UC13: Xuất PDF / HTML</text>
      <text x="130" y="43" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#b91c1c">(Chuẩn in A4 WeasyPrint)</text>
    </g>
  </g>

  <!-- Connectors from Actor to Core UCs -->
  <path d="M 125 410 C 180 300, 200 183, 275 183" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 125 420 C 180 340, 200 248, 275 248" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 125 430 C 180 390, 200 313, 275 313" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 125 440 C 180 430, 200 378, 275 378" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 125 450 C 180 450, 200 443, 275 443" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 125 460 C 180 480, 200 508, 275 508" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 125 470 C 180 520, 200 573, 275 573" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Include / Relationship Connectors between UCs -->
  <!-- UC06 includes UC12 (Theme apply) -->
  <path d="M 870 216 C 900 216, 910 216, 935 216" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrow-dash)"/>
  <text x="900" y="208" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b">&lt;&lt;include&gt;&gt;</text>

  <!-- UC10 includes UC02 (Open note from search) -->
  <path d="M 600 475 C 550 475, 480 300, 480 250" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrow-dash)"/>
  <text x="535" y="380" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b">&lt;&lt;include&gt;&gt;</text>

  <!-- UC13 includes UC06 (HTML Render engine) -->
  <path d="M 935 475 C 900 475, 890 230, 870 220" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrow-dash)"/>
  <text x="905" y="340" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b">&lt;&lt;include&gt;&gt;</text>
</svg>
