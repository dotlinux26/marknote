<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs>
    <filter id="erd-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" in="SourceAlpha"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="erd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f46e5"/>
    </marker>
    <marker id="trigger-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc"/>

  <!-- Title Header -->
  <text x="600" y="45" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#0f172a">
    SƠ ĐỒ CƠ SỞ DỮ LIỆU QUAN HỆ &amp; BẢNG ẢO CHỈ MỤC TOÀN VĂN SQLITE FTS5
  </text>
  <text x="600" y="70" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b">
    Tệp CSDL duy nhất: ~/.marknote/notes.db (Hoạt động ngoại tuyến 100%, bảo mật cục bộ)
  </text>

  <!-- Table 1: notes (x=60, y=120, width=280) -->
  <g id="tbl_notes" transform="translate(60, 110)" filter="url(#erd-shadow)">
    <rect width="280" height="270" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <path d="M 0 0 L 280 0 L 280 42 L 0 42 Z" fill="#e0f2fe"/>
    <text x="140" y="27" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0369a1">notes (Bảng Ghi chú)</text>
    
    <g transform="translate(18, 65)" font-family="'Consolas', monospace" font-size="12.5" fill="#1e293b">
      <text x="0" y="0"><tspan font-weight="700" fill="#dc2626">🔑 id</tspan> : INTEGER PRIMARY KEY</text>
      <text x="0" y="26"><tspan font-weight="700" fill="#2563eb">title</tspan> : TEXT NOT NULL</text>
      <text x="0" y="52">content_md : TEXT</text>
      <text x="0" y="78">created_at : DATETIME</text>
      <text x="0" y="104">updated_at : DATETIME</text>
      <text x="0" y="130">pinned : INTEGER (0 / 1)</text>
      <text x="0" y="156">archived : INTEGER (0 / 1)</text>
    </g>
  </g>

  <!-- Table 2: note_tag (Relationship table N-N, x=460, y=130) -->
  <g id="tbl_note_tag" transform="translate(460, 130)" filter="url(#erd-shadow)">
    <rect width="280" height="180" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <path d="M 0 0 L 280 0 L 280 42 L 0 42 Z" fill="#ede9fe"/>
    <text x="140" y="27" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#6d28d9">note_tag (Quan hệ N-N)</text>
    
    <g transform="translate(18, 68)" font-family="'Consolas', monospace" font-size="12.5" fill="#1e293b">
      <text x="0" y="0"><tspan font-weight="700" fill="#7c3aed">🔗 note_id</tspan> : INTEGER (FK)</text>
      <text x="0" y="28"><tspan font-weight="700" fill="#7c3aed">🔗 tag_id</tspan> : INTEGER (FK)</text>
      <text x="0" y="56"><tspan font-weight="700" fill="#dc2626">PRIMARY KEY</tspan> (note_id, tag_id)</text>
      <text x="0" y="78" font-size="11" fill="#64748b">ON DELETE CASCADE</text>
    </g>
  </g>

  <!-- Table 3: tags (x=860, y=130) -->
  <g id="tbl_tags" transform="translate(860, 130)" filter="url(#erd-shadow)">
    <rect width="280" height="180" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <path d="M 0 0 L 280 0 L 280 42 L 0 42 Z" fill="#dcfce7"/>
    <text x="140" y="27" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#15803d">tags (Bảng Nhãn Tag)</text>
    
    <g transform="translate(18, 68)" font-family="'Consolas', monospace" font-size="12.5" fill="#1e293b">
      <text x="0" y="0"><tspan font-weight="700" fill="#dc2626">🔑 id</tspan> : INTEGER PRIMARY KEY</text>
      <text x="0" y="28"><tspan font-weight="700" fill="#16a34a">name</tspan> : TEXT UNIQUE</text>
      <text x="0" y="56">color : TEXT (HEX #rrggbb)</text>
    </g>
  </g>

  <!-- Table 4: settings (x=860, y=410) -->
  <g id="tbl_settings" transform="translate(860, 410)" filter="url(#erd-shadow)">
    <rect width="280" height="170" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <path d="M 0 0 L 280 0 L 280 42 L 0 42 Z" fill="#fef3c7"/>
    <text x="140" y="27" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#b45309">settings (Bảng Cấu hình)</text>
    
    <g transform="translate(18, 68)" font-family="'Consolas', monospace" font-size="12.5" fill="#1e293b">
      <text x="0" y="0"><tspan font-weight="700" fill="#dc2626">🔑 key</tspan> : TEXT PRIMARY KEY</text>
      <text x="0" y="28">value : TEXT</text>
      <text x="0" y="56" font-size="11" fill="#64748b">Ví dụ: theme='default',</text>
      <text x="0" y="74" font-size="11" fill="#64748b">sync_scroll='ON'</text>
    </g>
  </g>

  <!-- Virtual Table: notes_fts (x=60, y=440) -->
  <g id="tbl_notes_fts" transform="translate(60, 440)" filter="url(#erd-shadow)">
    <rect width="400" height="190" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2" stroke-dasharray="6,4"/>
    <path d="M 0 0 L 400 0 L 400 42 L 0 42 Z" fill="#ffedd5"/>
    <text x="200" y="27" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#c2410c">notes_fts (Bảng ảo SQLite FTS5)</text>
    
    <g transform="translate(18, 65)" font-family="'Consolas', monospace" font-size="12.5" fill="#1e293b">
      <text x="0" y="0">title (Chỉ mục toàn văn tiêu đề)</text>
      <text x="0" y="26">content_md (Chỉ mục toàn văn nội dung)</text>
      <text x="0" y="52" fill="#9a3412">content='notes' (Ngoại bảng)</text>
      <text x="0" y="78" fill="#9a3412">tokenize='porter unicode61'</text>
    </g>
  </g>

  <!-- Connectors: notes -> note_tag (1 - N) -->
  <path d="M 340 215 L 460 215" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#erd-arrow)"/>
  <rect x="375" y="195" width="50" height="22" rx="4" fill="#ede9fe"/>
  <text x="400" y="211" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#6d28d9">1 - N</text>

  <!-- Connectors: tags -> note_tag (1 - N) -->
  <path d="M 860 215 L 740 215" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#erd-arrow)"/>
  <rect x="775" y="195" width="50" height="22" rx="4" fill="#ede9fe"/>
  <text x="800" y="211" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#6d28d9">N - 1</text>

  <!-- Trigger connector: notes <-> notes_fts -->
  <path d="M 200 380 L 200 440" fill="none" stroke="#ea580c" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#trigger-arrow)"/>
  <rect x="210" y="395" width="230" height="30" rx="6" fill="#ffedd5" stroke="#fed7aa" stroke-width="1"/>
  <text x="325" y="415" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#c2410c">
    Đồng bộ tức thời qua 3 Database Triggers
  </text>
</svg>
